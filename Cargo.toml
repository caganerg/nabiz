[package]
name = "nabiz"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Çekirdek başına CPU kullanımı, Intel çekirdek sıcaklıkları, RAM ve swap için sade, sakin bir terminal monitörü"
readme = "README.md"
license = "MIT"
repository = "https://github.com/caganerg/nabiz"
publish = false

[dependencies]
# Only the crossterm backend; no default widgets/macros/layout-cache we don't use.
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29"

[profile.release]
lto = true
codegen-units = 1
strip = true
