# Builds the .deb on Ubuntu 22.04, so it links against glibc 2.35 and
# installs on Ubuntu 22.04+ and Debian 12+.
#
# - Pushing a tag like v0.1.0 builds the package and attaches it to the
#   GitHub release of that tag (creating the release if needed).
# - Running it by hand (Actions → deb → Run workflow) only builds it and
#   keeps the .deb as a downloadable artifact.
name: deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build .deb
        run: ./scripts/build-deb.sh

      - name: Show package
        run: |
          for deb in target/debian/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: target/debian/*.deb
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" target/debian/*.deb --clobber
